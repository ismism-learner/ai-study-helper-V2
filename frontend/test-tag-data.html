<!DOCTYPE html>
<html>
<head>
    <title>Test Tag Data</title>
</head>
<body>
    <h1>Tag History Test</h1>
    <div id="output"></div>
    <script>
        const output = document.getElementById('output');
        
        // 检查 localStorage 中的 tagHistory
        const tagHistory = localStorage.getItem('tagHistory');
        output.innerHTML += '<h2>Tag History in localStorage:</h2>';
        output.innerHTML += '<p>' + (tagHistory || 'No tag history found') + '</p>';
        
        // 手动添加一些标签到 localStorage
        if (!tagHistory) {
            const defaultTags = ['历史', '金融', '意识形态', '数学', '哲学', '科学'];
            localStorage.setItem('tagHistory', JSON.stringify(defaultTags));
            output.innerHTML += '<h2>Added default tags to localStorage:</h2>';
            output.innerHTML += '<p>' + JSON.stringify(defaultTags) + '</p>';
        }
        
        output.innerHTML += '<h2>Current tagHistory:</h2>';
        output.innerHTML += '<p>' + localStorage.getItem('tagHistory') + '</p>';
        
        // 测试 allTags 逻辑
        output.innerHTML += '<h2>Test All Tags Logic:</h2>';
        output.innerHTML += '<p>This would normally be generated from book tags</p>';
    </script>
</body>
</html>
