<!DOCTYPE html>
<html>
<head>
    <title>Set Default Tags</title>
</head>
<body>
    <h1>Setting Default Tag History</h1>
    <div id="output"></div>
    <script>
        const output = document.getElementById('output');
        
        // 设置默认标签历史到 localStorage
        const defaultTags = ['历史', '金融', '意识形态', '数学', '哲学', '科学', '文学', '艺术', '历史历史', '心理学'];
        
        // 检查当前 localStorage 中的数据
        const currentTags = localStorage.getItem('tagHistory');
        output.innerHTML += '<h2>Current tagHistory:</h2>';
        output.innerHTML += '<p>' + (currentTags || 'No data found') + '</p>';
        
        // 如果没有数据，设置默认标签
        if (!currentTags) {
            localStorage.setItem('tagHistory', JSON.stringify(defaultTags));
            output.innerHTML += '<h2>Set default tagHistory:</h2>';
            output.innerHTML += '<p>' + JSON.stringify(defaultTags) + '</p>';
        } else {
            output.innerHTML += '<h2>Tag history already exists:</h2>';
            output.innerHTML += '<p>' + currentTags + '</p>';
        }
        
        // 验证设置是否成功
        const updatedTags = localStorage.getItem('tagHistory');
        output.innerHTML += '<h2>Updated tagHistory:</h2>';
        output.innerHTML += '<p>' + updatedTags + '</p>';
        
        output.innerHTML += '<h2>Done!</h2>';
        output.innerHTML += '<p>Default tags have been set. You can now use the tag dropdown in the edit form.</p>';
    </script>
</body>
</html>
